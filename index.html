<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<title>Haushaltsbudget</title>
<meta name="theme-color" content="#0F5C56" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1613" media="(prefers-color-scheme: dark)">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

  --bg: #F2F6F3;
  --surface: #FFFFFF;
  --surface-muted: #E7EFEA;
  --ink: #1C2B27;
  --ink-soft: #5B6D66;
  --brand: #0F5C56;
  --brand-soft: #DCEEE9;
  --positive: #2F7A56;
  --positive-bg: #E4F1E9;
  --negative: #B54A3E;
  --negative-bg: #F6E4E1;
  --border: #D9E3DE;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1613;
    --surface: #16211D;
    --surface-muted: #1D2A25;
    --ink: #E7F0EA;
    --ink-soft: #9CB0A8;
    --brand: #4FBBA9;
    --brand-soft: #1B342F;
    --positive: #7FC79B;
    --positive-bg: #17301F;
    --negative: #E08A78;
    --negative-bg: #35201C;
    --border: #28362F;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1613;
  --surface: #16211D;
  --surface-muted: #1D2A25;
  --ink: #E7F0EA;
  --ink-soft: #9CB0A8;
  --brand: #4FBBA9;
  --brand-soft: #1B342F;
  --positive: #7FC79B;
  --positive-bg: #17301F;
  --negative: #E08A78;
  --negative-bg: #35201C;
  --border: #28362F;
}

html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
.wrap { max-width: 480px; margin: 0 auto; }
.mono {
  font-family: 'IBM Plex Mono', 'SFMono-Regular', ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
}

/* Header */
header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--brand);
  color: #fff;
  padding: 14px 16px 12px;
}
.header-top { display: flex; align-items: center; justify-content: space-between; }
.app-title { font-weight: 700; font-size: 17px; letter-spacing: 0.01em; }
.view-toggle {
  display: flex; background: rgba(255,255,255,0.16); border-radius: 999px; padding: 3px;
}
.view-toggle button {
  border: none; background: transparent; color: rgba(255,255,255,0.85);
  font-family: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px;
  border-radius: 999px; cursor: pointer;
}
.view-toggle button.active { background: #fff; color: var(--brand); }

.month-nav { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 10px; }
.month-nav button {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  background: rgba(255,255,255,0.14); color: #fff; font-size: 18px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.month-nav button:active { background: rgba(255,255,255,0.28); }
.month-label { min-width: 140px; text-align: center; font-size: 18px; font-weight: 700; }

/* Main */
main { padding: 16px; padding-bottom: 132px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 18px;
}
.field-label { font-size: 13px; color: var(--ink-soft); font-weight: 500; margin-bottom: 6px; }

.income-input {
  width: 100%; border: none; background: transparent; color: var(--brand);
  font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 26px;
  text-align: right; padding: 2px 0;
}
.income-input:focus { outline: none; }

.section-label { font-size: 14px; font-weight: 600; color: var(--ink-soft); margin: 4px 2px 8px; }

.cat-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 10px 10px 14px; margin-bottom: 8px;
}
.cat-name {
  flex: 1; border: none; background: transparent; color: var(--ink);
  font-size: 14.5px; font-weight: 500; font-family: inherit; padding: 4px 0;
  min-width: 0;
}
.cat-name:focus { outline: none; }
.cat-amount {
  width: 104px; border: none; background: var(--surface-muted); color: var(--ink);
  font-family: 'IBM Plex Mono', monospace; font-size: 14.5px; font-weight: 600;
  text-align: right; padding: 8px 8px; border-radius: 8px;
}
.cat-amount:focus { outline: none; box-shadow: 0 0 0 2px var(--brand-soft); }
.cat-del {
  width: 30px; height: 30px; flex-shrink: 0; border-radius: 8px; border: none;
  background: transparent; color: var(--ink-soft); font-size: 15px; cursor: pointer;
}
.cat-del.confirm { background: var(--negative-bg); color: var(--negative); font-weight: 700; }

.add-cat-row { display: flex; gap: 8px; margin-top: 4px; }
.add-cat-btn {
  flex: 1; padding: 11px; border-radius: 12px; border: 1.5px dashed var(--border);
  background: transparent; color: var(--ink-soft); font-family: inherit;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
.add-cat-form { display: none; gap: 8px; margin-top: 4px; }
.add-cat-form.open { display: flex; }
.add-cat-form input {
  flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  font-family: inherit; font-size: 14px; background: var(--surface); color: var(--ink);
}
.add-cat-form button {
  border: none; border-radius: 10px; padding: 0 16px; background: var(--brand);
  color: #fff; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
}

/* Sticky footer summary */
.summary {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--border);
  z-index: 20;
}
.summary-inner { max-width: 480px; margin: 0 auto; }
.summary-row { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 0; }
.summary-row .label { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
.summary-row .value { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; }
.summary-row.rest .label { font-size: 14px; font-weight: 600; color: var(--ink); }
.summary-row.rest .value { font-size: 21px; font-weight: 700; }
.value.positive { color: var(--positive); }
.value.negative { color: var(--negative); }

/* Year view */
.year-summary {
  display: flex; gap: 8px; margin-bottom: 16px;
}
.year-summary .card { flex: 1; margin-bottom: 0; text-align: center; padding: 12px 8px; }
.year-summary .card .field-label { margin-bottom: 4px; }
.year-summary .card .value { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 16px; }

.year-row {
  display: flex; align-items: center; gap: 10px; padding: 9px 2px; cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.year-row:last-child { border-bottom: none; }
.year-row .m { width: 34px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.year-row .bar-track { flex: 1; height: 8px; background: var(--surface-muted); border-radius: 999px; overflow: hidden; }
.year-row .bar { height: 100%; border-radius: 999px; }
.year-row .bar.positive { background: var(--positive); }
.year-row .bar.negative { background: var(--negative); }
.year-row .val { width: 88px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; font-weight: 600; }

.hint { font-size: 12px; color: var(--ink-soft); text-align: center; margin-top: 6px; line-height: 1.5; }

#yearView { display: none; }

.credit {
  text-align: center;
  margin-top: 18px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  opacity: 0.55;
  background: linear-gradient(90deg, #9b7415, #f5d576, #fff6d8, #f5d576, #9b7415);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: #b8912f; /* Fallback, falls background-clip: text nicht unterstützt wird */
  -webkit-text-fill-color: transparent;
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-top">
      <div class="app-title">Haushaltsbudget</div>
      <div class="view-toggle">
        <button id="btnMonatView" class="active">Monat</button>
        <button id="btnJahrView">Jahr</button>
      </div>
    </div>
    <div class="month-nav" id="monthNav">
      <button id="prevMonth" aria-label="Vorheriger Monat">‹</button>
      <div class="month-label" id="monthLabel">Januar</div>
      <button id="nextMonth" aria-label="Nächster Monat">›</button>
    </div>
  </header>

  <main>
    <div id="monthView">
      <div class="card">
        <div class="field-label">Einkommen</div>
        <input class="income-input mono" id="incomeInput" inputmode="decimal" value="0,00 €">
      </div>

      <div class="section-label">Ausgaben</div>
      <div id="catList"></div>

      <button class="add-cat-btn" id="addCatBtn">+ Kategorie hinzufügen</button>
      <div class="add-cat-form" id="addCatForm">
        <input id="addCatInput" placeholder="Name der Kategorie" maxlength="40">
        <button id="addCatConfirm">Hinzufügen</button>
      </div>
      <div class="hint">Werte werden automatisch auf diesem Gerät gespeichert.</div>
    </div>

    <div id="yearView">
      <div class="year-summary">
        <div class="card">
          <div class="field-label">Einkommen</div>
          <div class="value" id="yearIncome">0 €</div>
        </div>
        <div class="card">
          <div class="field-label">Ausgaben</div>
          <div class="value" id="yearExpense">0 €</div>
        </div>
        <div class="card">
          <div class="field-label">Rest</div>
          <div class="value" id="yearRest">0 €</div>
        </div>
      </div>
      <div class="card" id="yearList"></div>
      <div class="hint">Tippe einen Monat an, um ihn zu bearbeiten.</div>
    </div>

    <div class="credit">build by Thomas</div>
  </main>

  <div class="summary">
    <div class="summary-inner">
      <div class="summary-row">
        <div class="label">Ausgaben gesamt</div>
        <div class="value mono" id="sumExpenses">0,00 €</div>
      </div>
      <div class="summary-row rest">
        <div class="label">Rest</div>
        <div class="value mono" id="sumRest">0,00 €</div>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "haushaltsbudget_v1";
  var MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  var DEFAULT_CATEGORIES = [
    "Miete / Wohnen","Nebenkosten (Strom, Wasser, Heizung)","Internet & Telefon",
    "Versicherungen","Auto / Verkehrsmittel","Kraftstoff","Lebensmittel",
    "Gesundheit","Freizeit & Hobby","Kleidung","Sparen / Rücklagen","Sonstiges"
  ];
  var EXAMPLE_JAN_EXPENSES = [750,220,45,180,120,150,400,50,100,60,200,80];
  var EXAMPLE_JAN_INCOME = 2800;

  function defaultState() {
    var expenses = [];
    for (var m = 0; m < 12; m++) {
      if (m === 0) expenses.push(EXAMPLE_JAN_EXPENSES.slice());
      else expenses.push(DEFAULT_CATEGORIES.map(function(){ return 0; }));
    }
    var income = new Array(12).fill(0);
    income[0] = EXAMPLE_JAN_INCOME;
    return {
      categories: DEFAULT_CATEGORIES.slice(),
      income: income,
      expenses: expenses
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.categories) || !Array.isArray(parsed.income) || !Array.isArray(parsed.expenses)) {
        return defaultState();
      }
      return parsed;
    } catch (e) {
      return defaultState();
    }
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { /* Speicher nicht verfügbar - App funktioniert trotzdem weiter */ }
  }

  var state = loadState();
  var currentMonth = new Date().getMonth();
  var view = "month"; // "month" | "year"
  var pendingDeleteIndex = -1;

  function fmt(value) {
    var n = Number(value) || 0;
    try {
      return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(n);
    } catch (e) {
      return n.toFixed(2).replace('.', ',') + ' €';
    }
  }

  function parseAmount(str) {
    if (typeof str !== 'string') return 0;
    var cleaned = str.replace(/[^0-9,.-]/g, '').replace(/\./g, '').replace(',', '.');
    var n = parseFloat(cleaned);
    return isNaN(n) ? 0 : n;
  }

  function monthSumExpenses(m) {
    var arr = state.expenses[m] || [];
    var sum = 0;
    for (var i = 0; i < arr.length; i++) sum += Number(arr[i]) || 0;
    return sum;
  }
  function monthRest(m) {
    return (Number(state.income[m]) || 0) - monthSumExpenses(m);
  }
  function yearIncomeSum() {
    var sum = 0;
    for (var m = 0; m < 12; m++) sum += Number(state.income[m]) || 0;
    return sum;
  }
  function yearExpenseSum() {
    var sum = 0;
    for (var m = 0; m < 12; m++) sum += monthSumExpenses(m);
    return sum;
  }

  // ---------- Rendering: Monatsansicht ----------
  var elMonthLabel = document.getElementById('monthLabel');
  var elIncomeInput = document.getElementById('incomeInput');
  var elCatList = document.getElementById('catList');
  var elSumExpenses = document.getElementById('sumExpenses');
  var elSumRest = document.getElementById('sumRest');
  var elMonthView = document.getElementById('monthView');
  var elYearView = document.getElementById('yearView');
  var elMonthNav = document.getElementById('monthNav');
  var elBtnMonat = document.getElementById('btnMonatView');
  var elBtnJahr = document.getElementById('btnJahrView');
  var elAddCatBtn = document.getElementById('addCatBtn');
  var elAddCatForm = document.getElementById('addCatForm');
  var elAddCatInput = document.getElementById('addCatInput');
  var elAddCatConfirm = document.getElementById('addCatConfirm');
  var elYearIncome = document.getElementById('yearIncome');
  var elYearExpense = document.getElementById('yearExpense');
  var elYearRest = document.getElementById('yearRest');
  var elYearList = document.getElementById('yearList');

  function renderMonthHeader() {
    elMonthLabel.textContent = MONTHS[currentMonth];
  }

  function renderIncome() {
    elIncomeInput.value = fmt(state.income[currentMonth]);
  }

  function renderCatList() {
    elCatList.innerHTML = '';
    state.categories.forEach(function (name, idx) {
      var row = document.createElement('div');
      row.className = 'cat-row';

      var nameInput = document.createElement('input');
      nameInput.className = 'cat-name';
      nameInput.value = name;
      nameInput.addEventListener('change', function () {
        state.categories[idx] = nameInput.value.trim() || name;
        saveState();
      });

      var amountInput = document.createElement('input');
      amountInput.className = 'cat-amount mono';
      amountInput.inputMode = 'decimal';
      var val = (state.expenses[currentMonth] && state.expenses[currentMonth][idx]) || 0;
      amountInput.value = fmt(val);
      amountInput.addEventListener('focus', function () {
        var raw = state.expenses[currentMonth][idx] || 0;
        amountInput.value = raw === 0 ? '' : String(raw).replace('.', ',');
      });
      amountInput.addEventListener('blur', function () {
        var parsed = parseAmount(amountInput.value);
        state.expenses[currentMonth][idx] = parsed;
        amountInput.value = fmt(parsed);
        saveState();
        renderSummary();
      });

      var delBtn = document.createElement('button');
      delBtn.className = 'cat-del';
      delBtn.textContent = '✕';
      delBtn.setAttribute('aria-label', 'Kategorie löschen');
      delBtn.addEventListener('click', function () {
        if (pendingDeleteIndex === idx) {
          state.categories.splice(idx, 1);
          state.expenses.forEach(function (monthArr) { monthArr.splice(idx, 1); });
          pendingDeleteIndex = -1;
          saveState();
          renderCatList();
          renderSummary();
        } else {
          pendingDeleteIndex = idx;
          renderCatList();
          setTimeout(function () {
            if (pendingDeleteIndex === idx) { pendingDeleteIndex = -1; renderCatList(); }
          }, 2500);
        }
      });
      if (pendingDeleteIndex === idx) {
        delBtn.classList.add('confirm');
        delBtn.textContent = '✓';
      }

      row.appendChild(nameInput);
      row.appendChild(amountInput);
      row.appendChild(delBtn);
      elCatList.appendChild(row);
    });
  }

  function renderSummary() {
    var sum = monthSumExpenses(currentMonth);
    var rest = monthRest(currentMonth);
    elSumExpenses.textContent = fmt(sum);
    elSumRest.textContent = fmt(rest);
    elSumRest.classList.remove('positive', 'negative');
    elSumRest.classList.add(rest < 0 ? 'negative' : 'positive');
  }

  function renderMonth() {
    renderMonthHeader();
    renderIncome();
    renderCatList();
    renderSummary();
  }

  // ---------- Rendering: Jahresansicht ----------
  function renderYear() {
    var incomeSum = yearIncomeSum();
    var expenseSum = yearExpenseSum();
    var restSum = incomeSum - expenseSum;

    elYearIncome.textContent = fmt(incomeSum);
    elYearExpense.textContent = fmt(expenseSum);
    elYearRest.textContent = fmt(restSum);
    elYearRest.classList.remove('positive', 'negative');
    elYearRest.classList.add(restSum < 0 ? 'negative' : 'positive');

    var maxAbs = 1;
    for (var m = 0; m < 12; m++) {
      maxAbs = Math.max(maxAbs, Math.abs(monthRest(m)));
    }

    elYearList.innerHTML = '';
    for (var i = 0; i < 12; i++) {
      var rest = monthRest(i);
      var pct = Math.min(100, Math.round((Math.abs(rest) / maxAbs) * 100));

      var row = document.createElement('div');
      row.className = 'year-row';

      var mEl = document.createElement('div');
      mEl.className = 'm';
      mEl.textContent = MONTHS[i].slice(0, 3);

      var track = document.createElement('div');
      track.className = 'bar-track';
      var bar = document.createElement('div');
      bar.className = 'bar ' + (rest < 0 ? 'negative' : 'positive');
      bar.style.width = pct + '%';
      track.appendChild(bar);

      var valEl = document.createElement('div');
      valEl.className = 'val mono';
      valEl.textContent = fmt(rest);
      valEl.style.color = rest < 0 ? 'var(--negative)' : 'var(--positive)';

      row.appendChild(mEl);
      row.appendChild(track);
      row.appendChild(valEl);

      (function (monthIndex) {
        row.addEventListener('click', function () {
          currentMonth = monthIndex;
          switchView('month');
        });
      })(i);

      elYearList.appendChild(row);
    }
  }

  // ---------- Ansicht wechseln ----------
  function switchView(next) {
    view = next;
    if (view === 'month') {
      elMonthView.style.display = 'block';
      elYearView.style.display = 'none';
      elMonthNav.style.display = 'flex';
      elBtnMonat.classList.add('active');
      elBtnJahr.classList.remove('active');
      renderMonth();
    } else {
      elMonthView.style.display = 'none';
      elYearView.style.display = 'block';
      elMonthNav.style.display = 'none';
      elBtnJahr.classList.add('active');
      elBtnMonat.classList.remove('active');
      renderYear();
    }
  }

  // ---------- Einkommen ----------
  elIncomeInput.addEventListener('focus', function () {
    var raw = state.income[currentMonth] || 0;
    elIncomeInput.value = raw === 0 ? '' : String(raw).replace('.', ',');
  });
  elIncomeInput.addEventListener('blur', function () {
    var parsed = parseAmount(elIncomeInput.value);
    state.income[currentMonth] = parsed;
    elIncomeInput.value = fmt(parsed);
    saveState();
    renderSummary();
  });

  // ---------- Monatsnavigation ----------
  document.getElementById('prevMonth').addEventListener('click', function () {
    currentMonth = (currentMonth + 11) % 12;
    pendingDeleteIndex = -1;
    renderMonth();
  });
  document.getElementById('nextMonth').addEventListener('click', function () {
    currentMonth = (currentMonth + 1) % 12;
    pendingDeleteIndex = -1;
    renderMonth();
  });

  // ---------- Ansichts-Umschalter ----------
  elBtnMonat.addEventListener('click', function () { switchView('month'); });
  elBtnJahr.addEventListener('click', function () { switchView('year'); });

  // ---------- Kategorie hinzufügen ----------
  elAddCatBtn.addEventListener('click', function () {
    elAddCatForm.classList.add('open');
    elAddCatBtn.style.display = 'none';
    elAddCatInput.value = '';
    elAddCatInput.focus();
  });

  function addCategory() {
    var name = elAddCatInput.value.trim();
    if (!name) { elAddCatInput.focus(); return; }
    state.categories.push(name);
    state.expenses.forEach(function (monthArr) { monthArr.push(0); });
    saveState();
    elAddCatForm.classList.remove('open');
    elAddCatBtn.style.display = '';
    renderCatList();
    renderSummary();
  }
  elAddCatConfirm.addEventListener('click', addCategory);
  elAddCatInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); addCategory(); }
    if (e.key === 'Escape') {
      elAddCatForm.classList.remove('open');
      elAddCatBtn.style.display = '';
    }
  });

  // ---------- Start ----------
  switchView('month');
})();
</script>
</body>
</html>
